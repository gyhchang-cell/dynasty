name: Build cod5 mod
on:
  push:
    branches: [cod5]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/cod5-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cod5-mod-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/cod5'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cod5
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare bundled dependencies and build
        run: |
          python3 tools/art/make_local_repo.py
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 build
      - name: Publish built mod to cod5
        run: |
          cp build/libs/dynasty-1.4.0.jar modpack/mods/dynasty-1.4.0.jar
          sha256sum modpack/mods/dynasty-1.4.0.jar > docs/infusion/jar.sha256
          git add modpack/mods/dynasty-1.4.0.jar docs/infusion/jar.sha256
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(cod5): publish tested infusion mod jar'
          git pull --rebase origin cod5
          git push origin HEAD:cod5
