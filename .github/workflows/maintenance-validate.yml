name: Validate maintenance source
on:
  push:
    branches: ['maintenance/validate-*-20261009']
    paths-ignore: ['modpack/mods/dynasty-1.4.0.jar', 'docs/maintenance/validation/**']
permissions:
  contents: write
concurrency:
  group: maintenance-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build this exact source
        id: build
        run: |
          python3 tools/art/make_local_repo.py
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2G -XX:ActiveProcessorCount=2' build
      - name: Run required Forge GameTests
        id: gametests
        continue-on-error: true
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *cod4-continuation*) namespaces=dynasty_cod4,dynasty_cod3,dynasty_network; minimum=52 ;;
            *cod1-3*) namespaces=dynasty_cod2,dynasty_network; minimum=61 ;;
            *cod4*) namespaces=dynasty_cod4,dynasty_network; minimum=32 ;;
            *cod6*) namespaces=dynasty_cod6,dynasty_cod3,dynasty_infusion,dynasty_network; minimum=61 ;;
            *integration*) namespaces=dynasty_cod2,dynasty_cod3,dynasty_cod4,dynasty_cod6,dynasty_infusion,dynasty_network; minimum=151 ;;
            *) echo 'Unrecognized validation branch'; exit 2 ;;
          esac
          export TEST_MINIMUM="$minimum"
          set +e
          timeout 900 ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2G -XX:ActiveProcessorCount=2' -I tools/maintenance/remote-validation.init.gradle -PmaintenanceNamespaces="$namespaces" runGameTestServer 2>&1 | tee maintenance-gametests.log
          gradle_status=${PIPESTATUS[0]}
          set -e
          export TEST_PROCESS_STATUS="$gradle_status"
          python3 - <<'PY'
          import os,re,pathlib
          log=pathlib.Path('maintenance-gametests.log').read_text(errors='replace')
          matches=re.findall(r'All (\d+) required tests passed',log)
          count=max(map(int,matches),default=0)
          if int(os.environ['TEST_PROCESS_STATUS']) or count<int(os.environ['TEST_MINIMUM']):
              raise SystemExit('No successful complete GameTest result; process='+os.environ['TEST_PROCESS_STATUS']+', passed='+str(count))
          print('Verified actual server completion:',count,'required tests passed')
          PY
      - name: Verify COD4 content and FTB quest references
        if: contains(github.ref_name, 'cod4-continuation')
        run: |
          python3 tools/cod4/audit.py
          python3 tools/art/verify_ftbquests.py build/libs
          bash tools/keju/run_keju_tests.sh
      - name: Preserve branch-built JAR and verification evidence
        if: always() && steps.build.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.gametests.outcome }}
        run: |
          cp build/libs/dynasty-1.4.0.jar modpack/mods/dynasty-1.4.0.jar
          mkdir -p docs/maintenance/validation
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          jar=pathlib.Path('modpack/mods/dynasty-1.4.0.jar')
          manifest={'source_commit':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],'sha256':hashlib.sha256(jar.read_bytes()).hexdigest(),'build':'success','gametests':os.environ['TEST_OUTCOME'],'run_id':os.environ['GITHUB_RUN_ID']}
          pathlib.Path('docs/maintenance/validation/result.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          cp maintenance-gametests.log docs/maintenance/validation/gametests.log
          git add modpack/mods/dynasty-1.4.0.jar docs/maintenance/validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: preserve exact validation source jar and test evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Require passing GameTests
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.gametests.outcome }}
        run: test "$BUILD_OUTCOME" = success && test "$TEST_OUTCOME" = success
