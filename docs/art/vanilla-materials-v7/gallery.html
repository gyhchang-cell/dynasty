 <h1>原版风材质 · 生机工坊</h1><p>资源预览，非游戏截图。基础方块降低纹理噪声；青铜甲朴素实用，玄天甲金白护片、青色宝石。玄天甲使用原版动态闪光及穿戴宝石呼吸光；没有改装备数值。</p>
