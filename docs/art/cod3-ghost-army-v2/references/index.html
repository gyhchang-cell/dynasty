<!doctype html><meta charset="utf-8"><title>100张实际参考</title><style>body{margin:0;background:#e8e9e4;color:#252e2c;font:17px system-ui;line-height:1.6}main{max-width:1400px;margin:auto;padding:32px}img{max-width:100%;height:auto}section{margin:36px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}figure{margin:0;background:#f7f7f1;padding:12px}a{color:#245949}.notice{padding:16px;border-left:5px solid #9c7e41;background:#f7f0db}small{overflow-wrap:anywhere}</style><main><h1>实际查看记录：100张 / 16个作者项目画廊</h1><p>不是100个独立模组或生物。含同甲型不同材质与姿态；仅学习结构连接、分区与握持，不复制纹理或日式/西式阵营符号。点击图片跳作者项目来源。</p><div class="grid"><figure><a href="https://modrinth.com/mod/epic-samurais/gallery"><img loading="lazy" src="image-f0e06426fca637f85984.img"></a><figcaption>1. epic-samurais<p>成组铠甲：胸身是主块，肩袖与下摆次之；不采用展示墙配色。</p><small>SHA256 24f4629eb0f44f2147ba695f6a7689e1f67c61791986876c0f8ec0cb9489b8e9</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-samurais/gallery"><img loading="lazy" src="image-c8d37b278b1581825cca.img"></a><figcaption>2. epic-samurais<p>同尺度兵士队列：头盔和肩线先于细纹形成职业轮廓。</p><small>SHA256 accc71f0a9ed2be0417070c666e5e30d8bf2af175a3021cc6a16510af679a064</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-fa913479f48cdd409669.img"></a><figcaption>3. samurai<p>持刃手与护臂连续，袖甲让位给手腕；只学连接，不用日式主题。</p><small>SHA256 a6f46dccbc39aa431f1b6641a2e398ce70947113b3a8ce37a55e2d4be3a7d4f7</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-29f8268fc7b6e2bf3b0a.img"></a><figcaption>4. samurai<p>成套槽位说明头盔、胸、腿的材质节奏，不逐片建模。</p><small>SHA256 6c5700bce1815149db087b333b76b5cb1afcb6588e639cc3b3da8e4ad155619a</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-182d2956718b416df142.img"></a><figcaption>5. samurai<p>暗色甲仍有袖口和面部明度分区。</p><small>SHA256 a29cb66427cb823728919c6d8b28c002965529549d73672d6985c99b653320fe</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-3fe82f867e7ba9a03e85.img"></a><figcaption>6. samurai<p>石灰甲与内袖形成硬软差别。</p><small>SHA256 fcfabae6ceb1289712c974a3c000a0efbdb727708d17da71880bf32f22aa9450</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-9413cf21a519bfd4fe25.img"></a><figcaption>7. samurai<p>肩护外扩克制，膝部不做巨大方盒。</p><small>SHA256 ae9f90da034ce70c01290b13ef4a24d112a2572fcf3ddf8320755b53dfe2687c</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-bc591128e920c4a08e89.img"></a><figcaption>8. samurai<p>金甲主面干净，边饰不铺满；兵俑不照搬金色。</p><small>SHA256 a52768c1b1e52913d1dae4a96f04a16a789ce1fcad7920b543ae85f49b54acb2</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-4a9459885414e1b65eac.img"></a><figcaption>9. samurai<p>肩甲、胸片和腰带有三层关系。</p><small>SHA256 f18e6e7a8629b2ac4d53e698682fcdc2327582e12836294c5d10d75670d28d7f</small></figcaption></figure><figure><a href="https://modrinth.com/mod/samurai/gallery"><img loading="lazy" src="image-77a42ca9ea81fc5a2109.img"></a><figcaption>10. samurai<p>深甲用少量亮面与脸区分，避免全黑。</p><small>SHA256 f6a198d5f19b492283733c13f09f066a07666cd1e703c0326a27124fc1ba9672</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-04b10cde70a2ee8d26f4.img"></a><figcaption>11. wizard-samurai-irons-spells-addon<p>红甲展示：甲裙分瓣，露出膝部活动空间。</p><small>SHA256 dbf5f60e7a7b5a55e933544b465c57a15264384cb274eb9428afa31e8f92ec08</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-6816f71a5bd2674e11cb.img"></a><figcaption>12. wizard-samurai-irons-spells-addon<p>夜间人像：头部开口与帽沿对比清楚；不取光影为材质。</p><small>SHA256 2b0e0c047c807ebdfafcb8e3d7481f367ad4cb43957698cddeb63fe9acf4f9cf</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-c0d045428ca1d8c95caa.img"></a><figcaption>13. wizard-samurai-irons-spells-addon<p>蓝黑甲：胸、肩、胫甲各有较大净面。</p><small>SHA256 3c6d21ead81f4f3bcb9abec969037fd9f21751d1efc7fa6ecd206dd7a43b8240</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-2dde3910b525befb035c.img"></a><figcaption>14. wizard-samurai-irons-spells-addon<p>紫甲面罩与颊护包覆，不把脸完全埋在大盔内。</p><small>SHA256 4b296037f0121f44d19067bdb4d941b314791165e36906201a6fb64a75ca0d35</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-8c7d0cf8ac9fd171a97b.img"></a><figcaption>15. wizard-samurai-irons-spells-addon<p>橙色外甲和暗内层分开，权重集中上躯。</p><small>SHA256 c68860f17aae52b78c4f759d25f6c9526c44161c8d13644fb899d4adfdd183d4</small></figcaption></figure><figure><a href="https://modrinth.com/mod/wizard-samurai-irons-spells-addon/gallery"><img loading="lazy" src="image-6ea8fceeb21cf8e9d326.img"></a><figcaption>16. wizard-samurai-irons-spells-addon<p>金色护肩的厚度来自体层而非四周白边。</p><small>SHA256 e42e088b186420435a6347dfc185f8a6169fd91e229777e333f04d3e65015bb6</small></figcaption></figure><figure><a href="https://modrinth.com/mod/sengoku-legends/gallery"><img loading="lazy" src="image-c9d03a08779f966f505c.img"></a><figcaption>17. sengoku-legends<p>庭院军士站姿：胸腰与脚底同一承重线，不套建筑。</p><small>SHA256 9f2a62f800f860335e7b03c9c52ed4d2a4f59b70106e252890d626b682d3310f</small></figcaption></figure><figure><a href="https://modrinth.com/mod/sengoku-legends/gallery"><img loading="lazy" src="image-34aaa453cd51a769cd41.img"></a><figcaption>18. sengoku-legends<p>普通战士与大型异形对照：本任务保留普通军士合理人体。</p><small>SHA256 279b42b4602460e30bd7c3baae7973f17ad74c936ee447d320a4cc70ebca9766</small></figcaption></figure><figure><a href="https://modrinth.com/mod/sengoku-legends/gallery"><img loading="lazy" src="image-61eb0d164e5174451bbd.img"></a><figcaption>19. sengoku-legends<p>重甲守卫：宽胸与短厚四肢，但本任务不采用怪物头。</p><small>SHA256 e9af92000e9b7c10f15ecdd89230dcfc28559b338c4dd8a673a522a3ca72131e</small></figcaption></figure><figure><a href="https://modrinth.com/mod/sengoku-legends/gallery"><img loading="lazy" src="image-c50c1bb9b11e49ae058d.img"></a><figcaption>20. sengoku-legends<p>斜侧持械：兵器离身距离与手腕位置清楚。</p><small>SHA256 1d03d2773d3514a41570722620b2c017ad6f8820785ba5b1e375398ffe5ccf47</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-7b8d393e308bf1759f18.img"></a><figcaption>21. epic-knights-shields-armor-and-weapons<p>铠甲阵列：以盔形、肩宽和盾兵长兵区分，非只换色。</p><small>SHA256 34bcee69834f20411cd356eab66fa201b703f5f9fb51c24af04bd97410d0dd81</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-ca5c12d26f7d49542103.img"></a><figcaption>22. epic-knights-shields-armor-and-weapons<p>轻甲露面，内衬从领口袖口连续到下摆。</p><small>SHA256 73304e113aa2d6b4cd5e55efb7ca678e23ed47dced01ab5de235b44a0c3ca2e3</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-d96a4fdbf3e9a21e3154.img"></a><figcaption>23. epic-knights-shields-armor-and-weapons<p>闭面厚盔和胸面分开；不采用角盔或西方纹章。</p><small>SHA256 c47e4a14cdd09f5f868be11d804bd982874968c3ec5015ae19a4b2a4d331dd00</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-42288498ce77d155c611.img"></a><figcaption>24. epic-knights-shields-armor-and-weapons<p>灰甲有面罩、肩、肘、手的分层。</p><small>SHA256 c6ad56ad2b3c23612869f89b6b7d7cec14bc81e40a4b048266a29223d7a4a665</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-5195cf55a3f636ab3b1a.img"></a><figcaption>25. epic-knights-shields-armor-and-weapons<p>圆盔与盾的轮廓不同，头不必堆满装饰。</p><small>SHA256 6348353ff871c210b7f73b207c954a83294085910a4b9dfb08c0f5cc1bf44366</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-76eacf73b3f45d251483.img"></a><figcaption>26. epic-knights-shields-armor-and-weapons<p>眼缝低于盔沿，领口暗层托住头部。</p><small>SHA256 811356a18a8d305b3309f821c466f40553e54a978bf2bc257a5af3c20797a5c2</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-7a56805f708b14be56e3.img"></a><figcaption>27. epic-knights-shields-armor-and-weapons<p>圆顶盔与直胸甲节奏；转译成有棱角俑盔。</p><small>SHA256 dd51cdd71dfd6faffffd869457d92803d9419ef97cc24d00d36d6e739ec69eb0</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-24dacfc82b49fa9df7bc.img"></a><figcaption>28. epic-knights-shields-armor-and-weapons<p>长兵高于头但主体仍可读，握点在身侧。</p><small>SHA256 e19d875f5e08d2dcbf3f3e86bb84d416860b7545d184119087dd8cfac7818b3b</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-46ee29cc52bfaada554e.img"></a><figcaption>29. epic-knights-shields-armor-and-weapons<p>羽冠是次识别，面罩和胸体仍是主要部分。</p><small>SHA256 d13ec6462057c748a9ab2d19f4180cfc0692168e812c851f711799ce9ee2ad8b</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-4c7459ccde3b1beed486.img"></a><figcaption>30. epic-knights-shields-armor-and-weapons<p>竖直冠缨不替代头盔主壳，兵俑仅留低脊。</p><small>SHA256 1e81bf0403b4eb7fab8bcb10950615997934bde121aea25203e4295d24a1e915</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-1dba6e211721a2364180.img"></a><figcaption>31. epic-knights-shields-armor-and-weapons<p>面盔与胸甲区别，护膝小于大腿主体。</p><small>SHA256 77485c08a1fc815baf516f51c6dda7c7c6e7303ade9ee730c22f186b84340d72</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-1f386e0bdb539dce47ce.img"></a><figcaption>32. epic-knights-shields-armor-and-weapons<p>长杆与手相交处明确，手未被大护手盖住。</p><small>SHA256 3b380325e02f5e68409994273a9ff7f19e949cba237ed15b2ac023af0a6fff54</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-e0da32ad2a05270e0170.img"></a><figcaption>33. epic-knights-shields-armor-and-weapons<p>大剑与盾不同材质，兵俑不用巨剑。</p><small>SHA256 747d81f9dd476b0af52a9757223b17a82c7bca7664075784d403db42a8c4a65f</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-dce8b97b01c397d75995.img"></a><figcaption>34. epic-knights-shields-armor-and-weapons<p>封闭面盔需眉沿与下颌轮廓；不抄十字甲。</p><small>SHA256 8e49aad0946bc905611e93b9f98b6a16aebf3522f308e75a3eb0b1a82c01fcf5</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-7ccf3109400256841404.img"></a><figcaption>35. epic-knights-shields-armor-and-weapons<p>锁甲使用贴图，不把链环建成零件。</p><small>SHA256 44138f0d90da2a831ca3dd0a8084084d93f73e25605dc8c1bc41442648127c7e</small></figcaption></figure><figure><a href="https://modrinth.com/mod/epic-knights-shields-armor-and-weapons/gallery"><img loading="lazy" src="image-cc61d8f6b515a05fe150.img"></a><figcaption>36. epic-knights-shields-armor-and-weapons<p>绿衣与铁甲有内外层，本任务用陶石和甲衣分区。</p><small>SHA256 76a585ec7db97790f5e3eb46a0cf932e72755b5db1a7b83e2ad8623e7f2fcb0b</small></figca
