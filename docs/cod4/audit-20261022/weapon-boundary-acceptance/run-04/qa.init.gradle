allprojects { p ->
 def base=p.file('build/cod4-weapon-boundary-20261023')
 p.layout.buildDirectory.set(new File(base,'gradle'))
 p.afterEvaluate {
  if(!p.plugins.hasPlugin('net.minecraftforge.gradle'))return
  def frozen=p.file('build/cod4-audit-20261022/frozen')
  p.sourceSets.main.java.setSrcDirs([new File(frozen,'src/main/java')])
  p.sourceSets.main.resources.setSrcDirs([new File(frozen,'src/main/resources'),new File(frozen,'src/generated/resources')])
  def classes=new File(base,'gradle/classes/java/main'),resources=new File(base,'gradle/resources/main')
  p.tasks.named('compileJava').configure{destinationDirectory.set(classes)}
  p.tasks.named('processResources').configure{destinationDir=resources}
  p.sourceSets.main.output.classesDirs.setFrom(classes);p.sourceSets.main.output.resourcesDir=resources
  def qa=p.sourceSets.create('weaponBoundaryQa') {
   java.srcDir p.file('tools/cod4/weapon-boundary-acceptance/java')
   compileClasspath+=p.sourceSets.main.output+p.sourceSets.main.compileClasspath
   runtimeClasspath+=output+p.sourceSets.main.output+p.sourceSets.main.runtimeClasspath
  }
  p.tasks.named(qa.processResourcesTaskName).configure {
   from(new File(frozen,'src/main/resources/data/dynasty/structures/bow_ritual_test.nbt')){into 'data/dynasty_weapon_boundary_qa/structures'}
  }
  def run=p.findProperty('boundaryRun')?:'run-01'
  p.minecraft.runs.gameTestServer {
   workingDirectory new File(base,run)
   property 'forge.enabledGameTestNamespaces','dynasty_weapon_boundary_qa'
   property 'forge.logging.console.level','info'
   property 'dynasty.weaponBoundary.output',p.file('docs/cod4/audit-20261022/weapon-boundary-acceptance/'+run+'/native-results.json').absolutePath
   jvmArgs '-Xmx2G','-XX:ActiveProcessorCount=2','-Djava.awt.headless=true'
   mods{dynasty{source qa}}
  }
  p.tasks.matching{it.name=='runGameTestServer'}.configureEach{dependsOn qa.classesTaskName;doFirst{p.file('docs/cod4/audit-20261022/weapon-boundary-acceptance/'+run).mkdirs()}}
  p.tasks.matching{it.name=='downloadAssets'||it.name=='downloadMCMeta'}.configureEach{onlyIf{false}}
  def metadata=new File(gradle.gradleUserHomeDir,'caches/forge_gradle/minecraft_repo/versions/1.20.1/version.json')
  def target=new File(base,'gradle/downloadMCMeta/version.json');target.parentFile.mkdirs();target.bytes=metadata.bytes
 }
}
