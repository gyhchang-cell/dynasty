pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// 工程名固定为 dynasty（影响 IDEA 模块名 dynasty.main，运行配置里引用的就是它）
rootProject.name = 'dynasty'