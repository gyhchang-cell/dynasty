org.gradle.jvmargs=-Xmx3G
# 常驻守护进程：重复构建快很多（原来 daemon=false，每次都要 fork 一次性 JVM 并重跑 ForgeGradle 初始化，
# 在慢机器上看起来就像「卡死」）。万一真卡住了，用 ./gradlew --stop 或 tools/打包整合包.command 里的清理步骤。
# Persistent daemon: repeat builds are much faster than forking a single-use JVM each time.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 跳过 ForgeGradle 启动时的「联网环境检查」（只影响构建，与游戏无关）：
# 网络不稳时它会卡在 Socket 读上十几分钟，构建看起来像死住。
# Skip ForgeGradle's server-connection environment check — it can hang for minutes
# on a stalled socket, which makes the build look frozen.
systemProp.net.minecraftforge.gradle.check.certs=false

# Select JDK 17 via JAVA_HOME or IDEA Gradle JVM; the Java toolchain enforces version 17.

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

mod_id=dynasty
mod_name=Dynasty
mod_license=All Rights Reserved
mod_version=1.4.0
mod_group_id=com.dynasty
mod_authors=Newton
mod_description=Dynasty is a Minecraft mod.
