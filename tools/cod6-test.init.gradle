allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def runId=p.findProperty('cod6Run')?.toString()
    if (!runId || !(runId ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply -Pcod6Run=<unique-run-id>')
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('build/cod6-test-'+runId)
        property 'forge.logging.console.level','info'
        property 'forge.enabledGameTestNamespaces','dynasty_cod6'
        jvmArgs '-Xmx1536m', '-XX:ActiveProcessorCount=2'
    }
} }
