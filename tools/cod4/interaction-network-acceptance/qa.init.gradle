allprojects { p ->
 p.layout.buildDirectory.set(p.file('tools/cod4/interaction-network-acceptance/.work/gradle'))
 p.afterEvaluate {
  if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
  def qa=p.sourceSets.create('interactionNetworkAcceptance') {
   java.srcDir p.file('tools/cod4/interaction-network-acceptance/src')
   resources.srcDir p.file('tools/cod4/interaction-network-acceptance/resources')
   compileClasspath += p.files('build/cod4-network-20261022/compile-dynasty') + p.sourceSets.main.compileClasspath
  }
  p.tasks.register('interactionNetworkAcceptanceJar',Jar) {
   dependsOn qa.classesTaskName
   archiveBaseName='dynasty-interaction-network-acceptance'
   manifest { attributes('MixinConfigs':'dynasty_guard_network_qa.mixins.json') }
   from qa.output
  }
  p.tasks.register('guardPatchJar',Jar) {
   archiveBaseName='dynasty-guard-patch'
   from(p.file('tools/cod4/guard-target-acceptance/.work/gradle-output/classes/java/main')) {
    include 'com/dynasty/expansion/SummonedGuard.class','com/dynasty/expansion/SecondaryMob.class'
   }
  }
  p.reobf { guardPatchJar {} }
  p.reobf { interactionNetworkAcceptanceJar {} }
 }
}
