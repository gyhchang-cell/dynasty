// Separate opt-in addon, no modifications/repackaging of the QA03 eleven-class mod.
allprojects { p ->
 p.afterEvaluate {
  if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
  def out=System.getProperty('dynasty.sweepdriver.build')
  def base=System.getProperty('dynasty.sweepdriver.baseline')
  def qa=System.getProperty('dynasty.sweepdriver.qaClasses')
  def root=System.getProperty('dynasty.sweepdriver.sources')
  if(!out||!base||!qa||!root)throw new GradleException('Private build, baseline, QA02 official classes and driver source paths required')
  p.layout.buildDirectory.set(p.file(out))
  def driver=p.sourceSets.create('sweepStageDriver') {
   java.srcDir new File(root,'src')
   resources.srcDir new File(root,'resources')
   compileClasspath += p.files(qa,base) + p.sourceSets.main.compileClasspath
  }
  p.tasks.register('sweepStageDriverJar',Jar) {
   dependsOn driver.classesTaskName
   archiveBaseName='dynasty-sweep-stage-driver'
   archiveVersion='1.0'
   from driver.output
  }
  p.reobf { sweepStageDriverJar {} }
 }
}
