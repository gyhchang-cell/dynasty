allprojects { p ->
 p.layout.buildDirectory.set(p.file('tools/cod4/journey-acceptance/survival/.work/gradle'))
 p.afterEvaluate {
  if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
  def qa=p.sourceSets.create('journeySurvivalQa') {
   java.srcDir p.file('tools/cod4/journey-acceptance/survival/src')
   resources.srcDir p.file('tools/cod4/journey-acceptance/survival/resources')
   compileClasspath += p.sourceSets.main.compileClasspath
  }
  p.tasks.register('journeySurvivalQaJar',Jar) {
   dependsOn qa.classesTaskName
   archiveBaseName='dynasty-journey-survival-qa'
   from qa.output
  }
  p.reobf { journeySurvivalQaJar {} }
 }
}
