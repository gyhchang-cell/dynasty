// Private frozen sources, outputs, Gradle project cache and headless test world.
allprojects { p ->
    def base = p.file('tools/cod4/journey-acceptance/.work/utility')
    p.layout.buildDirectory.set(new File(base, 'gradle'))
    p.afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        p.sourceSets.main.java.setSrcDirs([new File(base, 'frozen/src/main/java')])
        p.sourceSets.main.resources.setSrcDirs([new File(base, 'frozen/src/main/resources')])
        def classes = new File(base, 'gradle/classes/java/main')
        def mainResources = new File(base, 'gradle/resources/main')
        p.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        p.tasks.named('processResources').configure { destinationDir = mainResources }
        p.sourceSets.main.output.classesDirs.setFrom(classes)
        p.sourceSets.main.output.resourcesDir = mainResources
        def qa = p.sourceSets.create('journeyQa') {
            java.srcDir p.file('tools/cod4/journey-acceptance/java')
            java.include 'JourneyUtilityGameTests.java'
            resources.srcDir new File(base, 'qa-resources')
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
        }
        p.tasks.named(qa.processResourcesTaskName).configure {
            from(new File(base, 'frozen/src/main/resources/data/dynasty/structures')) {
                include 'bow_ritual_test.nbt'
                into 'data/dynasty_journey_utility_qa/structures'
            }
            from(new File(base, 'frozen/src/main/resources/data/dynasty_army/structures')) {
                include 'cauldron_pit_test.nbt'
                into 'data/dynasty_journey_utility_qa/structures'
            }
        }
        p.minecraft.runs.gameTestServer {
            workingDirectory new File(base, p.findProperty('journeyRun') ?: 'server')
            property 'forge.enabledGameTestNamespaces', 'dynasty_journey_utility_qa'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.refMapRemappingFile', new File(base, 'gradle/createSrgToMcp/output.srg').absolutePath
            property 'dynasty.journey.utility.report', new File(base, (p.findProperty('journeyRun') ?: 'server') + '/native-results.json').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=2', '-Djava.awt.headless=true'
            mods { dynasty { source qa } }
        }
        p.tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn qa.classesTaskName, 'createSrgToMcp' }
        p.tasks.matching { it.name == 'downloadAssets' || it.name == 'downloadMCMeta' }.configureEach { onlyIf { false } }
        def metadata = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_repo/versions/1.20.1/version.json')
        def target = new File(base, 'gradle/downloadMCMeta/version.json')
        target.parentFile.mkdirs()
        target.bytes = metadata.bytes
    }
}
