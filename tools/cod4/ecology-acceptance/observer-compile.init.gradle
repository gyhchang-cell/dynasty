// Compile passive QA diagnostics only; no run task or production source mutation.
allprojects { p ->
    p.layout.buildDirectory.set(p.file('tools/cod4/ecology-acceptance/.work/observer-compile/gradle-output'))
    p.afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        p.tasks.register('compileCod4EcologyObserver', JavaCompile) {
            source p.fileTree('tools/cod4/ecology-acceptance/bounded-src') { include '**/*.java' }
            classpath = p.sourceSets.main.compileClasspath
            destinationDirectory.set(p.file('tools/cod4/ecology-acceptance/.work/observer-compile/classes'))
            sourceCompatibility = '17'
            targetCompatibility = '17'
            options.encoding = 'UTF-8'
        }
    }
}
