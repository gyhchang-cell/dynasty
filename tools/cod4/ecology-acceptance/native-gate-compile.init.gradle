// Compile only. No Jar/reobf/run task and no changes to production sources or saves.
allprojects { p ->
 p.layout.buildDirectory.set(p.file('tools/cod4/ecology-acceptance/.work/native-gate-compile/gradle-output'))
 p.afterEvaluate {
  if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
  p.tasks.register('compileCod4NativeGateObserver',JavaCompile) {
   source p.fileTree('tools/cod4/ecology-acceptance/native-gate-src') { include '**/*.java' }
   classpath=p.sourceSets.main.compileClasspath
   destinationDirectory.set(p.file('tools/cod4/ecology-acceptance/.work/native-gate-compile/classes'))
   sourceCompatibility='17';targetCompatibility='17';options.encoding='UTF-8'
  }
 }
}
