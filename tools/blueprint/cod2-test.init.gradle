allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def runId = p.findProperty('cod2TestRun')?.toString()
    if (!runId || !(runId ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply -Pcod2TestRun=<unique-run-id>')
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('build/cod2-gametest/' + runId)
        property 'forge.logging.console.level', 'info'
        property 'forge.enabledGameTestNamespaces', p.hasProperty('cod2Regression') ? 'dynasty,dynasty_army,dynasty_cod2' : 'dynasty_cod2'
    }
} }
