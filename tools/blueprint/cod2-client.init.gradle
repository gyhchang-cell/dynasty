allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def run = p.findProperty('cod2ClientRun')?.toString()
    if (!run || !(run ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply -Pcod2ClientRun=<run-id>')
    def role = p.hasProperty('cod2Peer') ? 'peer' : 'host'
    def qa = p.sourceSets.create('cod2Qa') {
        java.srcDir p.file('tools/blueprint/dungeon-qa-src')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.client {
        workingDirectory p.file('build/cod2-client/' + run + '/' + role)
        property 'dynasty.cod2Qa.water', p.hasProperty('cod2Water') ? 'true' : 'false'
        property 'dynasty.cod2Qa.role', role
        property 'dynasty.cod2Qa.solo', p.hasProperty('cod2Solo') ? 'true' : 'false'
        property 'dynasty.cod2Qa.output', p.file('build/cod2-client/' + run + '/results').absolutePath
        property 'forge.logging.console.level', 'info'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', p.file('build/createSrgToMcp/output.srg').absolutePath
        jvmArgs '-Xmx1400m', '-XX:ActiveProcessorCount=2'
        args '--username', role == 'host' ? 'DungeonHost' : 'DungeonPeer', '--width', '1024', '--height', '768'
        mods { dynasty { source qa } }
    }
    p.tasks.matching { it.name == 'runClient' }.configureEach { task ->
        dependsOn qa.classesTaskName
        if (p.hasProperty('cod2PrepareOnly')) task.jvmArgumentProviders.add({ ->
                def target = p.file('build/cod2-client/' + run + '/launch.json')
                target.parentFile.mkdirs()
                target.text = groovy.json.JsonOutput.toJson([executable: task.executable,
                    jvmArgs: task.jvmArgs + task.systemProperties.collect { k,v -> "-D${k}=${v}".toString() },
                    classpath: task.classpath.asPath, main: task.mainClass.get(), args: task.args,
                    environment: task.environment.findAll { key, value -> key in ['MOD_CLASSES', 'MCP_MAPPINGS'] },
                    directory: task.workingDir.absolutePath])
                throw new StopExecutionException('Prepared isolated client launch')
        } as org.gradle.process.CommandLineArgumentProvider)
    }
} }
