allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def runId = p.findProperty('armyTestRun')?.toString()
    if (!runId || !(runId ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply -ParmyTestRun=<unique-run-id>')
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('build/army-gametest/' + runId)
        property 'forge.logging.console.level', 'info'
        property 'forge.enabledGameTestNamespaces', 'dynasty_army'
    }
} }
