allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def role = p.hasProperty('qaPeer') ? 'peer' : 'host'
    def runId = (p.findProperty('qaRun') ?: System.getProperty('qaRun'))?.toString()
    if (!runId || !(runId ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply a unique safe -PqaRun=<run-id> for both clients')
    def qa = p.sourceSets.create('blueprintQa') {
        java.srcDir p.file('tools/blueprint/qa-src')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.client {
        workingDirectory p.file('build/blueprint-client/' + role)
        property 'dynasty.blueprintQa', role
        property 'dynasty.blueprintQa.solo', p.hasProperty('qaSolo') ? 'true' : 'false'
        property 'dynasty.blueprintQa.connectionOnly', p.hasProperty('qaConnectionOnly') ? 'true' : 'false'
        property 'dynasty.blueprintQa.deathOnly', p.hasProperty('qaDeathOnly') ? 'true' : 'false'
        property 'dynasty.blueprintQa.run', runId
        property 'dynasty.blueprintQa.output', p.file('docs/blueprint-cod1/ingame/' + runId).absolutePath
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', p.file('build/createSrgToMcp/output.srg').absolutePath
        args '--username', role == 'peer' ? 'BlueprintPeer' : 'BlueprintHost', '--width', '1400', '--height', '900'
        mods { dynasty { source qa } }
    }
    p.tasks.configureEach { task -> if (task.name == 'runClient') task.dependsOn qa.classesTaskName }
} }
