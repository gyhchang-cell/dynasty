allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    // Incremental compilation restored stale test classes in the validation environment.
    p.tasks.named('compileJava').configure { options.incremental = false; outputs.upToDateWhen { false } }
    def runId = p.findProperty('infusionTestRun')?.toString()
    if (!runId || !(runId ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply -PinfusionTestRun=<unique-run-id>')
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('build/infusion-gametest/' + runId)
        property 'forge.logging.console.level', 'info'
        property 'forge.enabledGameTestNamespaces', p.findProperty('gameTestNamespaces') ?: 'dynasty_infusion'
    }
} }
