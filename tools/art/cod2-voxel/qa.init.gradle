// Isolated build output and optional QA source set; no QA classes in the mod JAR.
allprojects { p ->
    p.layout.buildDirectory.set(p.file('build/cod2-voxel-build'))
    p.afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        def qa=p.sourceSets.create('cod2VoxelQa') {
            java.srcDir p.file('tools/art/cod2-voxel/qa')
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client {
            workingDirectory p.file('build/cod2-voxel-client/prepared')
            property 'dynasty.cod2VoxelQa', 'true'
            property 'dynasty.cod2VoxelQa.output',p.file('docs/art/cod2-voxel-v1/native').absolutePath
            property 'mixin.env.remapRefMap','true'
            property 'mixin.env.refMapRemappingFile',p.file('build/cod2-voxel-build/createSrgToMcp/output.srg').absolutePath
            property 'forge.logging.console.level','info'
            jvmArgs '-Xmx2G','-XX:ActiveProcessorCount=2'
            args '--username','VoxelReviewer','--width','1400','--height','900'
            mods { dynasty { source qa } }
        }
        p.tasks.matching { it.name=='runClient' }.configureEach { task ->
            dependsOn qa.classesTaskName
            if(p.hasProperty('voxelPrepareOnly'))task.jvmArgumentProviders.add({ ->
                def dest=p.file('build/cod2-voxel-client/launch.json');dest.parentFile.mkdirs()
                dest.text=groovy.json.JsonOutput.toJson([executable:task.javaLauncher.get().executablePath.asFile.absolutePath,
                    jvmArgs:task.jvmArgs+task.systemProperties.collect { k,v -> "-D${k}=${v}".toString() },
                    classpath:task.classpath.asPath,main:task.mainClass.get(),args:task.args,
                    environment:task.environment.findAll { k,v -> k in ['MOD_CLASSES','MCP_MAPPINGS'] },directory:task.workingDir.absolutePath])
                throw new StopExecutionException('Prepared isolated art launch')
            } as org.gradle.process.CommandLineArgumentProvider)
        }
    }
}
