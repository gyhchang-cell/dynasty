gradle.projectsEvaluated {
    rootProject.sourceSets.main.java.srcDir rootProject.file('tools/art/workshop-qa')
    rootProject.sourceSets.main.java.exclude { entry ->
        entry.file.name.endsWith('.java') && entry.file.name != 'WorkshopTest.java' && entry.file.text.contains('@GameTestHolder')
    }
    rootProject.minecraft.runs.gameTestServer {
        workingDirectory rootProject.file('build/workshop-runtime-qa')
        property 'forge.enabledGameTestNamespaces', 'dynasty'
    }
}
