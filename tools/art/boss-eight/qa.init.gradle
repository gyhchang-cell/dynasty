allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    if (p.hasProperty('bossEightSnapshot')) {
        p.sourceSets.main.java.setSrcDirs([p.file('build/boss-eight-integrated/src/main/java')])
        p.sourceSets.main.resources.setSrcDirs([p.file('build/boss-eight-integrated/src/main/resources'),p.file('build/boss-eight-integrated/src/generated/resources')])
    }
    p.sourceSets.create('bossEightQa') {
        java.srcDir p.file('tools/art/boss-eight/qa')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.sourceSets.create('bossEightAgent') {
        java.srcDir p.file('tools/art/secondary-cuboid/agent')
        compileClasspath += p.sourceSets.main.compileClasspath
    }
    p.tasks.register('bossEightAgentJar', Jar) {
        from p.sourceSets.bossEightAgent.output
        archiveFileName.set('quiet-window-agent.jar')
        destinationDirectory.set(p.file('build/boss-eight-agent'))
        manifest { attributes('Premain-Class':'QuietWindowAgent') }
    }
} }
