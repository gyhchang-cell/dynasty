// Opt-in real-world/two-client QA; never packaged in the mod.
allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def run=p.findProperty('cod3ClientRun')?.toString()
    if (!run || !(run ==~ /[A-Za-z0-9_.-]+/)) throw new GradleException('Supply a fresh -Pcod3ClientRun=<id>')
    def qa=p.sourceSets.create('cod3ClientQa') {
        java.srcDir p.file('tools/art/cod3/native')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.client {
        workingDirectory p.file('build/cod3-client/'+run+'/host')
        property 'dynasty.cod3ClientQa.role','host'
        if(p.hasProperty('cod3NpcQaRoles'))property 'dynasty.cod3NpcQa.roles',p.findProperty('cod3NpcQaRoles').toString()
        if(p.hasProperty('cod3NpcQaState'))property 'dynasty.cod3NpcQa.state',p.findProperty('cod3NpcQaState').toString()
        property 'dynasty.cod3ClientQa.output',p.file('build/cod3-client/'+run+'/results').absolutePath
        property 'forge.logging.console.level','info'
        property 'mixin.env.remapRefMap','true'
        property 'mixin.env.refMapRemappingFile',p.file('build/createSrgToMcp/output.srg').absolutePath
        jvmArgs '-Xmx1400m','-XX:ActiveProcessorCount=2'
        if(System.getProperty('os.name').toLowerCase().contains('mac'))jvmArgs '-XstartOnFirstThread'
        args '--username','Cod3Host','--width','1024','--height','768'
        mods { dynasty { source qa } }
    }
    p.tasks.matching { it.name=='runClient' }.configureEach { task ->
        dependsOn qa.classesTaskName
        if(p.hasProperty('cod3ClientPrepare'))task.jvmArgumentProviders.add({ ->
            def file=p.file('build/cod3-client/'+run+'/launch.json');file.parentFile.mkdirs()
            file.text=groovy.json.JsonOutput.toJson([executable:task.javaLauncher.get().executablePath.asFile.absolutePath,
                jvmArgs:task.jvmArgs+task.systemProperties.collect { k,v -> "-D${k}=${v}".toString() },
                classpath:task.classpath.asPath,main:task.mainClass.get(),args:task.args,
                environment:task.environment.findAll { k,v -> k in ['MOD_CLASSES','MCP_MAPPINGS'] }])
            throw new StopExecutionException('Prepared cod3 native client runtime')
        } as org.gradle.process.CommandLineArgumentProvider)
    }
} }
