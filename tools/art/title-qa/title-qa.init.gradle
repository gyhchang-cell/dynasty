// Isolated, opt-in menu QA. No user saves, launcher options, or production test classes.
allprojects { p ->
    afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        def qa = p.sourceSets.create('titleQa') {
            java.srcDir p.file('tools/art/title-qa/src')
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client {
            workingDirectory p.file('build/title-screen-qa/client')
            property 'dynasty.titleQa', 'true'
            property 'dynasty.titleQa.output', p.file('build/title-screen-qa/results').absolutePath
            mods { dynasty { source qa } }
        }
        p.tasks.configureEach { task ->
            if (task.name == 'runClient') {
                task.dependsOn qa.classesTaskName
                task.doFirst {
                    p.delete(p.file('build/title-screen-qa/results/PASS.txt'),
                             p.file('build/title-screen-qa/results/FAIL.txt'))
                }
            }
        }
    }
}
