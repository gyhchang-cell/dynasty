// Remap pinned local third-party jars only in this disposable QA server.
allprojects { p ->
    afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        p.repositories.flatDir { dirs p.file('libs') }
        for (dep in ['com.dynpacks:architectury:9.2.14-forge',
                     'com.dynpacks:ftb-library-forge:2001.2.13',
                     'com.dynpacks:ftb-ultimine-forge:2001.1.8',
                     'com.dynpacks:worldedit-mod:7.2.15']) {
            p.dependencies.add('runtimeOnly',p.fg.deobf(dep))
        }
        p.minecraft.runs.gameTestServer {
            workingDirectory p.file('build/external-qol-qa')
            property 'dynasty.externalQolQa','true'
            property 'mixin.env.remapRefMap','true'
            property 'mixin.env.refMapRemappingFile',p.file('build/createSrgToMcp/output.srg').absolutePath
        }
        p.tasks.configureEach { task -> if (task.name=='runGameTestServer') task.dependsOn('createSrgToMcp') }
    }
}
