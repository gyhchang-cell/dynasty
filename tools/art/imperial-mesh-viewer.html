<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynasty · 真实模型检视</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0c1119;color:#e9e3d7}*{box-sizing:border-box}body{margin:0}header{display:flex;gap:24px;justify-content:space-between;align-items:center;padding:20px 30px;border-bottom:1px solid #30363e;background:#101720}h1{font-weight:600;font-size:21px;margin:0 0 5px}p{font-size:12px;color:#9eabba;margin:0}header small{letter-spacing:3px;font-size:10px;color:#be9c59}nav{display:flex;gap:9px;flex-wrap:wrap;padding:13px 30px;background:#151d27;border-bottom:1px solid #30363e}select,button{color:#dce3ec;background:#202a36;border:1px solid #354253;border-radius:5px;padding:8px 13px;font:12px system-ui}button{cursor:pointer}button:hover,button.active{color:#f6df9c;border-color:#a88c50;background:#3a3428}label{display:flex;align-items:center;gap:8px;font-size:12px;color:#aebccd}input{accent-color:#cfad68}#stage{position:relative;height:calc(100vh - 178px);min-height:500px;background:#101720}canvas{display:block;width:100%;height:100%;touch-action:none}#panels{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}#panels.single{display:block}#panels span{display:block;padding:19px 28px;color:#c1ccd6;font-size:12px;letter-spacing:2px}#panels span:empty{display:none}.status{position:absolute;bottom:14px;left:28px;color:#aec0ce;font-size:11px;white-space:pre-wrap;text-shadow:0 1px 3px #000}footer{height:39px;border-top:1px solid #30363e;padding:12px 30px;color:#8da0b1;font-size:11px;display:flex;justify-content:space-between}#error{position:absolute;top:20px;left:30px;color:#ffb6a2;white-space:pre-wrap;max-width:90%}@media(max-width:900px){header{padding:15px}nav{padding:10px}footer{padding:10px;font-size:10px}.optional{display:none}}
</style>
<header><div><small>DYNASTY / MODEL INSPECTION</small><h1>关羽与神龙 · 真实模型检视</h1><p>直接读取游戏模型顶点 · 深度遮挡 · 多角度检查</p></div><p>实际网格 / 摄影棚灯光预览<br>不是游戏截图，也不是 AI 概念图</p></header>
<nav>
  <select id="model" aria-label="模型"><option value="guanyu">关羽</option><option value="jade_dragon">青龙</option><option value="gold_dragon">金龙</option></select>
  <button data-view="threequarter">全身</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="portrait">头部</button><button data-view="four">四向检查</button>
  <label class="optional">形成进度<input id="formed" type="range" min="0" max="1" step="0.01" value="1"></label>
  <button id="normals">法线检查</button><button id="lighting">游戏材质预览</button>
</nav>
<div id="stage"><canvas id="canvas"></canvas><div id="panels"></div><div id="status" class="status">正在读取真实网格…</div><div id="error"></div></div>
<footer><span>拖动旋转 · 滚轮缩放 · 双击复位</span><span>不透明表面 · 深度缓冲 · 保留材质分界与硬边</span></footer>
<script src="imperial-mesh-viewer.js"></script>
</html>
