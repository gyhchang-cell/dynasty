// Isolated test-only sources and save directory. Never packaged with the mod.
allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def qa = p.sourceSets.create('guandaoQa') {
        java.srcDir p.file('tools/art/guandao-qa/src')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.client {
        def role = p.findProperty('guandaoRole') ?: 'solo'
        workingDirectory p.file('build/guandao-world-qa/' + (role == 'solo' ? 'client' : role))
        property 'dynasty.guandaoQa.role', role
        property 'dynasty.guandaoQa', 'true'
        property 'dynasty.guandaoQa.output', p.file(p.findProperty('guandaoOutput') ?: (p.hasProperty('guandaoRegression') ? 'docs/art/unification/weapon' : 'docs/art/guandao-refined')).absolutePath
        property 'dynasty.guandaoQa.regression', p.hasProperty('guandaoRegression') ? 'true' : 'false'
        property 'dynasty.guandaoQa.startStage', p.findProperty('guandaoStartStage') ?: '0'
        args '--username', role == 'peer' ? 'GuandaoPeer' : 'GuandaoHost', '--width', '1600', '--height', '1000'
        mods { dynasty { source qa } }
    }
    p.tasks.configureEach { task -> if(task.name=='runClient') {
        task.dependsOn qa.classesTaskName
        // Like the existing dungeon QA, release Gradle's cache lock before paired JVMs run.
        if (p.hasProperty('guandaoPrepareOnly')) task.jvmArgumentProviders.add({ ->
            def target = p.file('build/guandao-world-qa/launch.json')
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.toJson([executable: task.javaLauncher.get().executablePath.asFile.absolutePath,
                jvmArgs: task.jvmArgs + task.systemProperties.collect { k,v -> "-D${k}=${v}".toString() },
                classpath: task.classpath.asPath, main: task.mainClass.get(), args: task.args,
                environment: task.environment.findAll { key, value -> key in ['MOD_CLASSES', 'MCP_MAPPINGS'] },
                directory: task.workingDir.absolutePath])
            throw new StopExecutionException('Prepared isolated guandao client launch')
        } as org.gradle.process.CommandLineArgumentProvider)
    } }
} }
