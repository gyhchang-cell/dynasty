allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    if(p.findProperty('qaJei'))p.dependencies.add('runtimeOnly',p.fg.deobf('mezz.jei:jei-1.20.1-forge:15.59.0.210'))
    def peer=p.findProperty('qaPeer') ? 'peer' : 'host'
    def qa=p.sourceSets.create('unificationQa') {
        java.srcDir p.file('tools/art/unification-qa/src')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
    p.minecraft.runs.client {
        workingDirectory p.file('build/unification-client/'+peer)
        property 'dynasty.unificationQa',peer
        property 'dynasty.unificationQa.solo',p.findProperty('qaSolo')?'true':'false'
        property 'mixin.env.remapRefMap','true'
        property 'mixin.env.refMapRemappingFile',p.file('build/createSrgToMcp/output.srg').absolutePath
        property 'dynasty.unificationQa.output',p.file('docs/art/unification/'+(p.findProperty('qaSolo')?'solo':'network/'+peer)).absolutePath
        args '--username',peer=='peer'?'DynastyPeer':'DynastyHost','--width','1200','--height','800'
        mods { dynasty { source qa } }
    }
    p.tasks.configureEach { t->if(t.name=='runClient')t.dependsOn qa.classesTaskName }
} }
