// Dedicated art-only QA classes; never included in the production JAR.
def artOutput = gradle.startParameter.projectProperties.get('guicheArtBuild')
if (artOutput) allprojects { p -> p.layout.buildDirectory.set(p.file(artOutput)) }
allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    p.sourceSets.create('guicheArtQa') {
        java.srcDir p.file('tools/art/guiche/qa')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
        runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
    }
} }
