gradle.projectsEvaluated {
    rootProject.sourceSets.main.java.srcDir rootProject.file('tools/megabuild/qa-src')
    rootProject.sourceSets.main.java.exclude { entry ->
        entry.file.name.endsWith('.java') && entry.file.name != 'CourtyardSaveTest.java' && entry.file.text.contains('@GameTestHolder')
    }
    rootProject.minecraft.runs.gameTestServer {
        workingDirectory rootProject.file('build/courtyard-runtime-qa')
        def full = rootProject.hasProperty('fullCourtyard')
        property 'dynasty.courtyard.full', full.toString()
        property 'dynasty.courtyard.world', rootProject.file(full ? 'build/courtyard-full-completion/world' : 'build/courtyard-completion/world').absolutePath
        property 'forge.enabledGameTestNamespaces', 'dynasty'
    }
}
