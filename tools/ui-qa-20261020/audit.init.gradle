allprojects { p -> afterEvaluate {
 if(!p.plugins.hasPlugin('net.minecraftforge.gradle'))return
 def qa=p.sourceSets.create('uiAudit') {
  java.srcDir p.file('tools/ui-qa-20261020/qa')
  compileClasspath += p.sourceSets.main.output+p.sourceSets.main.compileClasspath
 }
 p.tasks.register('uiAuditJar',Jar) {
  dependsOn qa.classesTaskName
  archiveBaseName='dynasty-audit-ui'
  from qa.output
  from(p.file('tools/ui-qa-20261020/resources'))
 }
 p.reobf { uiAuditJar {} }
} }
