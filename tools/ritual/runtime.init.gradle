allprojects { p ->
    afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        def qa = p.sourceSets.create('ritualRuntimeQa') {
            java.srcDir p.file('tools/ritual/runtime')
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += output + p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
        }
        p.minecraft.runs.client {
            workingDirectory p.file('build/ritual-render-qa/client')
            property 'dynasty.ritualRenderQa', 'true'
            property 'dynasty.ritualRenderQa.output', p.file('build/ritual-render-qa/results').absolutePath
            mods { dynasty { source qa } }
        }
        p.tasks.configureEach { if (it.name == 'runClient') it.dependsOn qa.classesTaskName }
    }
}
