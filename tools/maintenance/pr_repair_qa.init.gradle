allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file('build/pr-repair-tests/' + (p.findProperty('repairRun') ?: 'targeted'))
        property 'forge.logging.console.level', 'info'
        property 'forge.enabledGameTestNamespaces', p.findProperty('repairNamespaces') ?: 'dynasty_cod4'
        jvmArgs '-Xmx3G', '-XX:ActiveProcessorCount=2'
    }
} }
allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def metadata = new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/minecraft_repo/versions/1.20.1/version.json')
    p.tasks.named('downloadMCMeta').configure {
        onlyIf { false }
    }
    def target = p.file('build/downloadMCMeta/version.json')
    target.parentFile.mkdirs()
    target.bytes = metadata.bytes
    // Dedicated server validation does not require client sound/texture downloads.
    p.tasks.matching { it.name == 'downloadAssets' }.configureEach { onlyIf { false } }
} }
