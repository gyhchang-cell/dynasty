allprojects { p -> afterEvaluate {
    if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
    def validationRun = p.findProperty('maintenanceRun')?.toString()
    if (validationRun && !(validationRun ==~ /[A-Za-z0-9_.-]+/))
        throw new GradleException('maintenanceRun must be a simple run identifier')
    def validationProcessors = p.findProperty('maintenanceProcessors')?.toString() ?: '2'
    if (!(validationProcessors in ['2', '4']))
        throw new GradleException('maintenanceProcessors must be 2 or 4')
    def validationHeap = p.findProperty('maintenanceHeap')?.toString() ?: '2G'
    if (!(validationHeap in ['2G', '4G']))
        throw new GradleException('maintenanceHeap must be 2G or 4G')
    p.minecraft.runs.gameTestServer {
        workingDirectory p.file(validationRun ? 'build/maintenance-gametest/' + validationRun : 'build/maintenance-gametest')
        property 'forge.logging.console.level', 'info'
        property 'forge.enabledGameTestNamespaces', p.findProperty('maintenanceNamespaces')
        jvmArgs "-Xmx${validationHeap}", "-XX:ActiveProcessorCount=${validationProcessors}"
    }
    // Dedicated server tests do not use client texture/audio assets.
    p.tasks.matching { it.name == 'downloadAssets' }.configureEach { onlyIf { false } }
} }
