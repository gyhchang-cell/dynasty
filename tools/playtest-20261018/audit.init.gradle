allprojects { p -> afterEvaluate {
 if(!p.plugins.hasPlugin('net.minecraftforge.gradle'))return
 def qa=p.sourceSets.create('playAudit') {
  java.srcDir p.file('tools/playtest-20261018/qa')
  compileClasspath += p.sourceSets.main.output+p.sourceSets.main.compileClasspath
 }
 p.tasks.register('auditJar',Jar) {
  dependsOn qa.classesTaskName
  archiveBaseName='dynasty-playtest-helper'
  from qa.output
  from(p.file('tools/playtest-20261018/resources'))
 }
 p.reobf { auditJar {} }
} }
