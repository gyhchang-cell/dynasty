modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
credits="Code, assets, data and localisation by the Dynasty Team"
description='''
完整东方王朝模组 / A complete Eastern Dynasty mod
• 两个自定义维度：天朝·龙庭（汉白玉大陆、4 个自定义群系）与地府（黑石熔岩、2 个自定义群系）
• 真实世界生成：噪声地形、矿脉、地表/地下结构
• 宏伟建筑：48×48 皇家宫殿（台基、城墙、角楼、太和殿、御花园）与帝陵地宫
• 科举 GUI 答题 + 官阶/功名/忠诚/叛乱数值系统
• 军队阵型：方阵、锋矢阵、雁行阵、横阵、圆阵
• 生物：大臣、刺客、弓兵、锦衣卫、叛军、年兽、麒麟、凤凰、九尾狐
• Boss：龙帝、叛将、宦官首脑、亡故始皇
• 酿造台药水：龙威、铁壁、疾风、威慑、民心、天命
• 节日活动（按现实日期）：春节、端午、中秋、重阳、除夕
• 内置《王朝图鉴》GUI，无需 Patchouli

Two custom dimensions, six custom biomes, palace and mausoleum worldgen structures, a Keju exam GUI
with rank/loyalty/rebellion stats, army formations, mythical beasts, three bosses, brewing-stand
potions, real-date festivals and a built-in codex.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15,)"
ordering="AFTER"
side="BOTH"
